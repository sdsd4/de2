<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корочек.нет</title>
  <link rel="icon" type="image/webp" href="{{ url_for('static', filename='images/image01.webp') }}">
<style>
* {font-family: sans-serif; text-decoration: none}
body {margin: 0}
.header a, button a {color: #fff}
.header {position: sticky; top: 0; display: flex; align-items: center; justify-content: center; gap: 12px; 
  margin: 0; padding: 15px; background: #3749bb; color: #fff; font-size: 24px}
.logo {width: auto; height: 36px; flex-shrink: 0; object-fit: contain; border-radius: 50%}
.footer {height: 80px; position: fixed; bottom: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: center;
  margin: 0; padding: 5px; background: #fff; color: #fff}
.footer img {height: 80px; width: auto; object-fit: contain}

h2 {font-size: 18px; text-align: center}
.container {max-width: 600px; margin: auto; padding: 15px; padding-bottom: 110px;}
form {margin-top: 10px; padding: 15px; background: #eaecfd; border-radius: 20px; text-align: center}
.error {margin-top: 15px; font-size: 14px; color: red; text-align: center}

input, select, textarea {box-sizing: border-box; width: 100%; 
  margin: 5px 0; padding: 10px; font-size: 14px; border: 0; border-radius: 5px}
input:not(:placeholder-shown):invalid {border: 2px solid red; background-color: #fff0f0; outline: none}
.help {margin: 5px; font-size: 16px; font-weight: bold; text-align: center}
.menu a {display: block; margin: 8px 0; padding: 10px; text-align: center; 
  background: #dfe3ff; color: #333; border-radius: 10px}

button {width: 100%; margin: 5px 0; padding: 10px; font-size: 16px; color: #fff; 
  background: #3749bb; border: 0; border-radius: 10px; cursor: pointer}
.btn {display:inline-block; width: 20%; margin: 10px 0; padding: 10px; font-size: 14px; color: #fff; 
  background: #3749bb; border: 0; border-radius: 10px; cursor: pointer; text-align: center}
button:hover, .btn:hover {background-color: #5561b1}

.slider {position: relative; max-width: 600px; margin: 20px auto}
.slide {display: none; width: 100%; height: 250px; object-fit: cover; border-radius: 10px}
.slide:first-child {display: block}
.nav-btn {position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; font-size: 15px; color: #fff;
  background: rgba(0,0,0,0.5); border: 0; border-radius: 50%; cursor: pointer}
.nav-btn.left {left: 10px}
.nav-btn.right {right: 10px}
</style>
</head>

<body>
  <div class="header">
    <img src="{{ url_for('static', filename='images/image01.webp') }}" class="logo">
    <a href="/?page=dashboard">Корочек.нет</a>
  </div>
  <div class="container">
  {% block content %}
  {% endblock %}
  </div>
</body>
  <div class="footer">
    <img src="{{ url_for('static', filename='images/image16.jpg') }}">
  </div>
</html>
