{% extends "base.html" %}

{% block content %}
<div class="container">
<h2>Регистрация</h2>
<form method="post">
    <input name="login" placeholder="Логин" required minlength="6" 
           pattern="^[A-Za-z0-9]{6,}$" title="Только латиница и цифры, минимум 6 символов">
    <input name="password" type="password" placeholder="Пароль" required minlength="8" 
           title="Минимум 8 символов">
    <input name="fio" placeholder="ФИО" required 
           pattern="^[А-Яа-яЁё\s]+$" title="Только кириллица и пробелы">
    <input name="phone" placeholder="Телефон" required 
           pattern="^8\(\d{3}\)\d{3}-\d{2}-\d{2}$" title="Формат: 8(XXX)XXX-XX-XX">
    <input name="email" type="email" placeholder="Email" required 
           title="Введите корректный адрес электронной почты">
    <button>Создать</button>
    <button><a href="/?page=login">Уже зарегистрированы?</a></button>
</form>
</div>
{% endblock %}
